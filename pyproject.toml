[project]
name = "backoffice_tramites"
version = "0.1.1"
description = "Backoffice de tramites - Microservice for San Felipe Government"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django[argon2]>=6.0.2",
    "django-environ>=0.13.0",
    "django-jazzmin>=3.0.3",
    "django-storages[sftp]>=1.14.6",
    "gunicorn>=25.1.0",
    "psycopg[binary]>=3.3.3",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.2.0",
    "factory-boy>=3.3.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-django>=4.12.0",
    "pytest-factoryboy>=2.8.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.2",
    "ty>=0.0.69",
    "django-types>=0.24.0",
    "mdformat>=1.0.0",
]

# =============================================================================
# Tooling configuration
# =============================================================================
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["sanfelipe", "core", "tests", "tramites"]
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
# Enable these rule sets for Django projects
select = [
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "DJ",    # flake8-django
    "DTZ",   # flake8-datetimez (Timezone safety)
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "FURB",  # A tool for refurbishing and modernizing Python codebases.
    "I",     # isort
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PT",    # flake8-pytest-style-pt specific for pytest
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit (Security)
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports (Absolute imports)
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

ignore = [
    "PLR2004",  # Magic value comparison
    "C416",     # Complex comprehensions can be readable
    "PT003"
]

[tool.ruff.lint.per-file-ignores]
# Django settings files often have long lines
"sanfelipe/settings.py" = ["E501"]
# Tests can have long lines
"tests/**/*.py" = ["E501", "B011", "S101", "S105", "S106", "S107"]
# Migrations are auto-generated — skip all lint checks
"*/migrations/**/*.py" = ["E501", "B008", "C4", "RUF012"]
# Allow unused imports in __init__.py
"__init__.py" = ["F401", "UP035"]

# ---------------------------------------------------------------------------
# Pre-existing debt (grandfathered): these files carry long-standing lint
# violations unrelated to current type-fix work. They are ignored here to keep
# the pre-commit ruff hook green when these files are touched; the debt is
# tracked separately for incremental cleanup.
# ---------------------------------------------------------------------------
"tramites/admin.py" = [
    "ARG002",   # admin hooks (has_add_permission, etc.) must keep Django's signature
    "E501",     # long lines in message strings / format calls
    "PLR0912",  # many flat-if chains in admin views
    "PLR0915",  # long methods
    "RET504",   # pre-return assignment
    "S308",     # mark_safe used deliberately (pre-validated HTML)
]
"tramites/sftp.py" = [
    "PLR0912",
    "PLR0915",
]
"core/management/commands/sftp.py" = [
    "ARG002",   # BaseCommand.handle(*args, **options) signature
    "B007",     # os.walk unused dirnames
    "BLE001",   # SFTP/paramiko error handling
    "E501",
    "PERF401",
    "PLC0415",  # mid-function import (lazy, avoids heavy import)
    "PLR0912",
    "PLR0915",
    "SIM105",
]
# ---------------------------------------------------------------------------
# Grandfathered debt (batch 2): same policy as above. Long-standing lint
# violations whose fix would be risky (legacy DB schemas, Django API contracts,
# settings globals() injection) or trivial noise (print-based health-check
# scripts). Kept green via per-file ignores; tracked for incremental cleanup.
# ---------------------------------------------------------------------------
"core/apps.py" = [
    "PLC0415",  # import inside AppConfig.ready (Django-recommended lazy pattern)
]
"core/db_router.py" = [
    "ARG002",   # DatabaseRouter hooks keep Django's **hints signature
    "PLC0415",  # lazy import to avoid heavy django.apps import
]
"core/forms.py" = [
    "ARG002",   # UserCreationForm.save(commit) contract
    "S105",     # relative admin password URL, not a real password
]
"core/management/commands/audit_tests.py" = [
    "ARG002",   # BaseCommand.handle(*args, **options) signature
]
"core/management/commands/setup_roles.py" = [
    "ARG002",   # BaseCommand.handle(*args, **options) signature
]
"core/management/commands/simular_pago.py" = [
    "ARG002",   # BaseCommand.handle(*args, **options) signature
]
"core/managers.py" = [
    "ARG001",   # QuerySet/Manager overrides keep Django's API signature
    "ARG002",
    "PLR0913",  # bulk_create() must mirror Django's full signature
    "PLR0917",
]
"core/model_config.py" = ["E501"]
"core/signals.py" = [
    "ARG001",   # signal receiver signature (sender, **kwargs)
    "BLE001",   # broad except in signal wrapper
]
"core/views.py" = [
    "ARG001",   # Django view/cbv handler signatures
]
"docker/healthcheck.py" = [
    "S310",     # urllib on known http(s) health endpoints
    "T201",     # CLI health-check script intentionally uses print
]
"manage.py" = ["PLC0415"]  # import inside main() (standard manage.py pattern)
"sanfelipe/apps.py" = ["PLC0415"]
"sanfelipe/context_processors.py" = ["ARG001"]  # context processor request arg
"sanfelipe/settings/__init__.py" = [
    "ARG005",   # lambda used elsewhere; request arg unused
    "E501",
    "F821",     # names injected dynamically via globals() (environ pattern)
]
"sanfelipe/settings/security.py" = ["E501"]
"sanfelipe/settings_test.py" = [
    "F403",  # star import from settings is the intended test override pattern
    "F405",
]
"tests/tramites/test_models.py" = ["ARG001"]
"tests/tramites/test_sftp.py" = ["ARG001"]
"tramites/models/actividades.py" = ["DJ001"]  # legacy DB uses null=True on texts
"tramites/models/catalogos.py" = ["DJ001"]    # managed=False legacy tables
"tramites/models/tramite.py" = ["DJ001"]      # legacy DB schema; changing would need data migration

[tool.ruff.lint.isort]
# Known-first-party for Django apps
known-first-party = ["tramites", "catalogos", "bitacora", "costos", "core", "sanfelipe"]

[tool.ruff.lint.pydocstyle]
# Google-style docstrings (common in Django)
convention = "google"

[tool.lint.flake8-tidy-imports]
# Require lazy imports for specific modules.
require-lazy = ["typing"]

[tool.ruff.format]
# Use single quotes for Python
quote-style = "single"

[tool.ty.environment]
# Project root as single first-party root so `core.X`, `tramites.X`, etc. resolve
root = ["."]
python = "./.venv"

[tool.ty.analysis]
replace-imports-with-any = [
    "allauth.**",
    "unfold.**",
    "import_export.**",
    "django_ratelimit.**",
    "environ.**",
    "tablib.**",
]

[tool.ty.rules]
# ty has no plugin system (Django support is on its roadmap), so it cannot
# resolve Django's runtime-generated model metadata (fields, managers, Meta,
# dynamic class construction). These rules fire on every Django model use and
# are false positives in this codebase. Keep them as warnings: visible but
# never blocking. See [tool.ty.terminal] below.
invalid-type-form = "warn"
unresolved-attribute = "warn"
unresolved-import = "warn"
invalid-method-override = "warn"
invalid-assignment = "warn"

[tool.ty.terminal]
error-on-warning = false

[[tool.ty.overrides]]
include = ["sanfelipe/settings/**"]

[tool.ty.overrides.rules]
# Settings inject names into the module namespace dynamically via
# `globals()[key] = value` from configure_*() helpers (environ pattern);
# ty cannot see those names (DEBUG, TESTING, etc.).
unresolved-reference = "warn"

[tool.pyright]
exclude = [
    "**/node_modules", "**/__pycache__", "**/.*",
    "db/", "docker/", "fixtures/",
    "htmlcov", "logs", "media", "nginx",
    "static", "staticfiles", "templates"
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[tool.djangofmt]
# Django template formatter (https://github.com/UnknownPlatypus/djangofmt)
line-length = 120
indent-width = 4
profile = "django"
html-void-self-closing = "never"

[tool.mdformat]
wrap = 80
number = true
end_of_line = "lf"
exclude = [
    ".venv/**",
    ".agents/**",
    ".claude/**",
    ".github/**",
    ".opencode/**",
    ".pi/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "__pycache__/**",
    "**/node_modules/**",

    # exclude all .txt files
    "**/*.txt",

    # exclude all files that are not suffixed .md
    "**/?", "**/??", "**/???", "**/*[!.]??", "**/*[!m]?", "**/*[!d]",
]

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
# Use test settings
DJANGO_SETTINGS_MODULE = 'sanfelipe.settings_test'
django_find_project = false

# Test discovery patterns
pythonpath = ['.']
testpaths = ['tests']
python_files = ['test_*.py', '*_test.py']
python_classes = ['Test*']
python_functions = ['test_*']

# Add default options
addopts = [
    '--reuse-db',
    '--tb=short',
    '--verbose',
]

# Pytest markers
markers = [
    'slow: marks tests as slow (deselect with -m "not slow")',
    'integration: marks tests as integration tests',
]
