[project]
name = "backoffice_tramites"
version = "0.1.0"
description = "Backoffice de tramites - Microservice for San Felipe Government"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django[argon2]>=6.0.2",
    "django-environ>=0.13.0",
    "django-jazzmin>=3.0.3",
    "django-storages[sftp]>=1.14.6",
    "gunicorn>=25.1.0",
    "psycopg[binary]>=3.3.3",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.2.0",
    "factory-boy>=3.3.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-django>=4.12.0",
    "pytest-factoryboy>=2.8.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.2",
    "django-stubs[compatible-mypy]>=6.0.9",
    "ty>=0.0.69",
]

# =============================================================================
# Tooling configuration
# =============================================================================
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["sanfelipe", "core", "tests", "tramites"]
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
# Enable these rule sets for Django projects
select = [
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "DJ",    # flake8-django
    "DTZ",   # flake8-datetimez (Timezone safety)
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "FURB",  # A tool for refurbishing and modernizing Python codebases.
    "I",     # isort
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PT",    # flake8-pytest-style-pt specific for pytest
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit (Security)
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports (Absolute imports)
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

ignore = [
    "PLR2004",  # Magic value comparison
    "C416",     # Complex comprehensions can be readable
    "PT003"
]

[tool.ruff.lint.per-file-ignores]
# Django settings files often have long lines
"sanfelipe/settings.py" = ["E501"]
# Tests can have long lines
"tests/**/*.py" = ["E501", "B011", "S101", "S105", "S106", "S107"]
# Migrations are auto-generated — skip all lint checks
"*/migrations/**/*.py" = ["E501", "B008", "C4", "RUF012"]
# Allow unused imports in __init__.py
"__init__.py" = ["F401", "UP035"]

[tool.ruff.lint.isort]
# Known-first-party for Django apps
known-first-party = ["tramites", "catalogos", "bitacora", "costos", "core", "sanfelipe"]

[tool.ruff.lint.pydocstyle]
# Google-style docstrings (common in Django)
convention = "google"

[tool.lint.flake8-tidy-imports]
# Require lazy imports for specific modules.
require-lazy = ["typing"]

[tool.ruff.format]
# Use single quotes for Python
quote-style = "single"

[tool.ty.environment]
# Project root as single first-party root so `core.X`, `tramites.X`, etc. resolve
root = ["."]
python = "./.venv"

[tool.ty.analysis]
replace-imports-with-any = [
    "allauth.**",
    "unfold.**",
    "import_export.**",
    "django_ratelimit.**",
    "environ.**",
    "tablib.**",
]

[tool.pyright]
exclude = [
    "**/node_modules", "**/__pycache__", "**/.*",
    "db/", "docker/", "fixtures/",
    "htmlcov", "logs", "media", "nginx",
    "static", "staticfiles", "templates"
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "sanfelipe.settings"

[tool.djangofmt]
# Django template formatter (https://github.com/UnknownPlatypus/djangofmt)
line-length = 120
indent-width = 4
profile = "django"
html-void-self-closing = "never"

[tool.mdformat]
wrap = 80
number = true
end_of_line = "lf"
exclude = [
    ".venv/**",
    ".agents/**",
    ".claude/**",
    ".github/**",
    ".opencode/**",
    ".pi/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "__pycache__/**",
    "**/node_modules/**",

    # exclude all .txt files
    "**/*.txt",

    # exclude all files that are not suffixed .md
    "**/?", "**/??", "**/???", "**/*[!.]??", "**/*[!m]?", "**/*[!d]",
]

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
# Use test settings
DJANGO_SETTINGS_MODULE = 'sanfelipe.settings_test'
django_find_project = false

# Test discovery patterns
pythonpath = ['.']
testpaths = ['tests']
python_files = ['test_*.py', '*_test.py']
python_classes = ['Test*']
python_functions = ['test_*']

# Add default options
addopts = [
    '--reuse-db',
    '--tb=short',
    '--verbose',
]

# Pytest markers
markers = [
    'slow: marks tests as slow (deselect with -m "not slow")',
    'integration: marks tests as integration tests',
]
