{% extends "errors/base_error.html" %}

{% block title %}500 — Error del servidor{% endblock %}

{% block content %}
<div class="error-page error-500">
    <div class="error-code">500</div>
    <div class="error-icon">
        <i class="fas fa-exclamation-triangle"></i>
    </div>
    <div class="error-title">Error del servidor</div>
    <div class="error-message">
        Algo salió mal. Intenta de nuevo más tarde.
    </div>
    <div class="error-action">
        <a href="{% url 'admin:index' %}" class="btn btn-primary">
            <i class="fas fa-home me-1"></i>Volver al inicio
        </a>
    </div>
</div>
{% endblock %}
