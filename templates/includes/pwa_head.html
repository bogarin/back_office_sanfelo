{% load static %}
{% with dept=BACKOFFICE_DEPARTMENT|lower %}
    <link rel="manifest" href="{% url 'pwa-manifest' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static dept|add:'/icon-180.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static dept|add:'/icon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static dept|add:'/icon-16.png' %}">
    <link rel="shortcut icon" href="{% static dept|add:'/favicon.ico' %}" type="image/x-icon">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#9d2638">
    <script src="{% static 'js/sw-register.js' %}" defer></script>
{% endwith %}
