{% extends "errors/base_error.html" %}

{% block title %}403 — Acceso denegado{% endblock %}

{% block content %}
    <div class="error-page error-403">
        <div class="error-code">403</div>
        <div class="error-icon">
            <i class="fas fa-lock"></i>
        </div>
        <div class="error-title">Acceso denegado</div>
        <div class="error-message">No tienes permisos para acceder a esta página.</div>
        <div class="error-action">
            <a href="{% url 'admin:index' %}" class="btn btn-primary">
                <i class="fas fa-home me-1"></i>Volver al inicio
            </a>
        </div>
    </div>
{% endblock %}
